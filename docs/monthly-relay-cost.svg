<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="title desc">
  <title id="title">Monthly relay cost by hours online</title>
  <desc id="desc">The Tokyo relay starts at zero and costs about 1.65 cents per hour. At about 182 relay hours per month it reaches Playit Premium's starting price of 3 US dollars per month.</desc>
  <rect x="0.5" y="0.5" width="719" height="285" rx="12" fill="#fff" stroke="#d0d7de"/>
  <g font-family="system-ui, sans-serif" fill="#24292f">
    <path d="M58 26H679 M58 70H679 M58 114H679 M58 158H679 M58 202H679 M58 246H679" stroke="#d8dee4" fill="none"/>
    <path d="M58 26V246H679" stroke="#afb8c1" fill="none"/>
    <g text-anchor="end" font-size="15" fill="#57606a">
      <text x="46" y="31">$5</text>
      <text x="46" y="75">$4</text>
      <text x="46" y="119">$3</text>
      <text x="46" y="163">$2</text>
      <text x="46" y="207">$1</text>
      <text x="46" y="251">$0</text>
    </g>
    <g text-anchor="middle" font-size="15" fill="#57606a">
      <text x="58" y="270">0 h</text>
      <text x="265" y="270">100 h</text>
      <text x="471.99999999999994" y="270">200 h</text>
      <text x="679" y="270">300 h</text>
    </g>
    <path d="M58 114H679" stroke="#9a4b0d" stroke-width="2.5" stroke-dasharray="9 5"/>
    <path d="M435.32 114V246" stroke="#8c959f" stroke-dasharray="4 4"/>
    <path d="M58 246L679 28.75" stroke="#0969da" stroke-width="3" fill="none"/>
    <circle cx="435.32" cy="114" r="5.5" fill="#fff" stroke="#24292f" stroke-width="2"/>
    <g font-size="16" font-weight="600">
      <text x="365" y="48" fill="#0550ae">Minecraft Proxy (Tokyo)</text>
      <text x="669" y="139" text-anchor="end" fill="#8a410a">Playit Premium</text>
      <text x="435.32" y="97" text-anchor="middle">≈182 h</text>
    </g>
  </g>
</svg>
